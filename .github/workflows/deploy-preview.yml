name: Deploy Preview (Frontend + PHP) to Netcup

on:
  push:
    branches:
      - dev   # nur Deploy, wenn auf 'dev' gepusht wird

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Code auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node.js Setup (für Frontend-Build)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Dependencies installieren und Build starten
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 4️⃣ Deployment-Ordner für Frontend vorbereiten
      - name: Prepare frontend deploy folder
        run: |
          mkdir deploy-frontend
          cp -r frontend/dist/* deploy-frontend/
          echo "Frontend deployment folder ready"

      # 5️⃣ Deployment-Ordner für Backend vorbereiten
      - name: Prepare backend deploy folder
        run: |
          mkdir deploy-backend
          cp -r backend/* deploy-backend/
          echo "Backend deployment folder ready"

      # 6️⃣ Frontend-Deployment auf Netcup hochladen
      - name: Deploy Frontend to Netcup (Preview)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy-frontend/
          server-dir: /preview.club-forum-bb.de/httpdocs/
          dangerous-clean-slate: true

      # 7️⃣ Backend-Deployment auf Netcup hochladen
      - name: Deploy Backend (PHP) to Netcup (Preview)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy-backend/
          server-dir: /api-preview.club-forum-bb.de/httpdocs
          dangerous-clean-slate: true
