name: Deploy Preview (Frontend + PHP) to Netcup

on:
  push:
    branches:
      - dev   # nur Deploy, wenn auf 'dev' gepusht wird

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Code auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node.js Setup (für Frontend-Build)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Dependencies installieren
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # 4️⃣ Environment-Datei für Preview erzeugen
      - name: Create .env.production for Preview
        working-directory: ./frontend
        run: echo "VITE_API_URL=https://api-preview.club-forum-bb.de" > .env.production

      # 5️⃣ Frontend builden
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 6️⃣ Deployment-Ordner für Frontend vorbereiten
      - name: Prepare frontend deploy folder
        run: |
          mkdir deploy-frontend
          cp -r frontend/dist/* deploy-frontend/
          echo "Frontend deployment folder ready"

      # 7️⃣ PHP Setup für Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # 8️⃣ Cache Composer dependencies (beschleunigt Builds massiv)
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # 9️⃣ Install PHP dependencies (Composer)
      - name: Install Composer dependencies (Backend)
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader

      # 🔟 Deployment-Ordner für Backend vorbereiten
      - name: Prepare backend deploy folder
        run: |
          mkdir deploy-backend
          cp -r backend/* deploy-backend/
          echo "Backend deployment folder ready"

      # 1️⃣1️⃣ Frontend-Deployment auf Netcup (Preview)
      - name: Deploy Frontend to Netcup (Preview)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy-frontend/
          server-dir: /preview.club-forum-bb.de/httpdocs/
          dangerous-clean-slate: false # 🟢 Kein Full-Wipe
          state-name: frontend-deploy-state.json # 🧠 merkt sich geänderte Dateien
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/tests/**

      # 1️⃣2️⃣ Backend-Deployment auf Netcup (Preview)
      - name: Deploy Backend (PHP) to Netcup (Preview)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy-backend/
          server-dir: /api-preview.club-forum-bb.de/httpdocs/
          dangerous-clean-slate: false
          state-name: backend-deploy-state.json
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/tests/**
