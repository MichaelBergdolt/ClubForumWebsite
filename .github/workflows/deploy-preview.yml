name: Deploy Preview (Frontend + PHP) to Netcup via Rsync

on:
  push:
    branches:
      - dev  # Nur Deploy, wenn auf 'dev' gepusht wird

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Code auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js Setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Dependencies installieren (Frontend)
      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      # 4. Environment-Datei erzeugen
      - name: Create .env.production for Preview
        working-directory: ./frontend
        run: echo "VITE_API_URL=https://api-preview.club-forum-bb.de" > .env.production

      # 5. Frontend builden
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 6. Deployment-Ordner für Frontend vorbereiten
      - name: Prepare frontend deploy folder
        run: |
          mkdir deploy-frontend
          cp -r frontend/dist/* deploy-frontend/

      # 7. Install PHP dependencies (Backend)
      - name: Install Composer dependencies (Backend)
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader

      # 8. Deployment-Ordner für Backend vorbereiten
      - name: Prepare backend deploy folder
        run: |
          mkdir deploy-backend
          cp -r backend/* deploy-backend/

      # --- SCHRITTE 9-11: NEUER DEPLOY PROZESS (Rsync statt FTP) ---

      # 9. SSH Key installieren
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'unnecessary' # Akzeptiert den Host-Key automatisch
          if_key_exists: replace

      # 10. Frontend-Deployment auf Netcup (Rsync)
      - name: Deploy Frontend to Netcup (Preview)
        run: |
          # -a: Archiv-Modus (behält Rechte, etc.)
          # -v: Verbose (zeigt, was es tut)
          # -z: Komprimiert Daten bei der Übertragung
          # --delete: Löscht alte Dateien auf dem Server (wie dangerous-clean-slate)
          rsync -avz --delete ./deploy-frontend/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/preview.club-forum-bb.de/httpdocs/

      # 11. Backend-Deployment auf Netcup (Rsync)
      - name: Deploy Backend (PHP) to Netcup (Preview)
        run: |
          rsync -avz --delete ./deploy-backend/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/api-preview.club-forum-bb.de/httpdocs/