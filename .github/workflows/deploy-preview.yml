name: Deploy Preview (Frontend + PHP) to Netcup via ZIP

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # --- SCHRITTE 1-8: BUILD PROZESS (Leicht angepasst) ---

      # 1. Code auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js Setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Dependencies installieren (Frontend)
      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      # 4. Environment-Datei erzeugen
      - name: Create .env.production for Preview
        working-directory: ./frontend
        run: echo "VITE_API_URL=https://api-preview.club-forum-bb.de" > .env.production

      # 5. Frontend builden
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 6. Deployment-Ordner für Frontend vorbereiten
      - name: Prepare frontend deploy folder
        run: |
          mkdir deploy-frontend
          cp -r frontend/dist/* deploy-frontend/

      # 7. Install PHP dependencies (Backend)
      - name: Install Composer dependencies (Backend)
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader

      # 8. Deployment-Ordner für Backend vorbereiten
      - name: Prepare backend deploy folder
        run: |
          mkdir deploy-backend
          cp -r backend/* deploy-backend/

      # --- SCHRITTE 9-13: NEUER DEPLOY PROZESS (ZIP & SSH) ---

      # 9. Frontend-Build zippen
      - name: Zip Frontend Build
        run: |
          cd deploy-frontend
          zip -r ../frontend-build.zip .
          cd ..

      # 10. Backend-Build zippen
      - name: Zip Backend Build
        run: |
          cd deploy-backend
          zip -r ../backend-build.zip .
          cd ..

      # 11. Frontend-ZIP per FTP hochladen
      - name: Deploy Frontend ZIP to Netcup
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-file: ./frontend-build.zip
          remote-file: /preview.club-forum-bb.de/httpdocs/frontend-build.zip

      # 12. Backend-ZIP per FTP hochladen
      - name: Deploy Backend ZIP to Netcup
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-file: ./backend-build.zip
          remote-file: /api-preview.club-forum-bb.de/httpdocs/backend-build.zip

      # 13. Builds auf Server per SSH entpacken
      - name: Unzip Deployments on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true # Bricht ab, wenn ein Befehl fehlschlägt
          script: |
            echo "--- 1. Navigiere zum Frontend-Verzeichnis ---"
            cd /preview.club-forum-bb.de/httpdocs/
            
            echo "--- 2. Entpacke Frontend (überschreibt alles) ---"
            unzip -o frontend-build.zip
            
            echo "--- 3. Lösche Frontend-ZIP ---"
            rm frontend-build.zip
            
            echo "--- 4. Navigiere zum Backend-Verzeichnis ---"
            cd /api-preview.club-forum-bb.de/httpdocs/
            
            echo "--- 5. Entpacke Backend (das kann dauern) ---"
            unzip -o backend-build.zip
            
            echo "--- 6. Lösche Backend-ZIP ---"
            rm backend-build.zip
            
            echo "--- Deployment abgeschlossen ---"