name: Deploy Production (Frontend + PHP) to Netcup

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1 Code auschecken
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2 Node.js Setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3 Frontend Dependencies
      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      # 4 Env Datei für Production
      - name: Create .env.production
        working-directory: ./frontend
        run: echo "VITE_API_BASE_URL=https://api.club-forum-bb.de" > .env.production

      # 5 Robots.txt
      - name: Use production robots.txt
        run: cp frontend/public/robots.prod.txt frontend/public/robots.txt

      # 6 Build Frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 7 PHP Dependencies (Backend)
      - name: Install Composer dependencies (Backend)
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      # 8 SSH Key Setup
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'
          if_key_exists: replace

      # 9 Known Hosts hinzufügen
      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # 10 Backend packen
      - name: Archive Backend
        run: tar -czf backend.tar.gz -C ./backend .

      # 11 Backend hochladen
      - name: Upload Backend Tarball
        run: scp backend.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/api.club-forum-bb.de/

      # 12 Backend entpacken
      - name: Extract Backend on Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /api.club-forum-bb.de/httpdocs/ && \
            tar -xzf ../backend.tar.gz && \
            rm ../backend.tar.gz
          "

      # 13 Frontend packen
      - name: Archive Frontend
        run: tar -czf frontend.tar.gz -C ./frontend/dist .

      # 14 Frontend hochladen
      - name: Upload Frontend Tarball
        run: scp frontend.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/club-forum-bb.de/

      # 15 Frontend entpacken
      - name: Extract Frontend on Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /club-forum-bb.de/httpdocs/ && \
            tar -xzf ../frontend.tar.gz && \
            rm ../frontend.tar.gz
          "