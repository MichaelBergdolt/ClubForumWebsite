name: Deploy Frontend + PHP to Netcup

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Prepare deploy folder
        run: |
          rm -rf deploy
          mkdir deploy
          cp -r frontend/dist/* deploy/
          mkdir -p deploy/api
          cp -r backend/* deploy/api/

      - name: Deploy to Netcup via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy/
          server-dir: /httpdocs/
          dangerous-clean-slate: true
