name: Deploy Website (Frontend + PHP) to Netcup

on:
  push:
    branches:
      - main  # oder dein Produktionsbranch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build  # oder dein Build-Befehl

      - name: Prepare deploy folder
        run: |
          mkdir deploy
          cp -r dist/* deploy/          # statische Dateien (Frontend)
          cp -r backend/* deploy/api/   # dein PHP-Backend-Ordner (z. B. ./backend)
          echo "Deployment folder ready"

      - name: Deploy to Netcup via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy
          server-dir: /html
          dangerous-clean-slate: true
