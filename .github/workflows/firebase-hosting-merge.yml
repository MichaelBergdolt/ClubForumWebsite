name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main   # passe den Branch an, den du deployen willst

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      # optionaler Rollup-Fix, falls npm ci zickt
      - name: Ensure Rollup installed
        run: |
          cd frontend
          npm install rollup --force

      - name: Build project
        run: |
          cd frontend
          npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORUMWEBSITE_22926 }}
          channelId: live
          projectId: forumwebsite-22926
